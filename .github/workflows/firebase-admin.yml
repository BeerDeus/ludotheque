name: Firebase admin

# Utilise le secret FIREBASE_SERVICE_ACCOUNT (contenu du JSON du compte de service).
on:
  push:
    paths: ['firestore.rules']
  workflow_dispatch:
    inputs:
      command:
        description: Action
        type: choice
        required: true
        default: rules-deploy
        options: [rules-deploy, access-allow, access-show, seed, families]
      email:
        description: Email (pour access-allow)
        required: false
      family:
        description: familyId (pour seed, si plusieurs familles)
        required: false

permissions:
  contents: read

concurrency:
  group: firebase-admin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      CMD: ${{ github.event_name == 'push' && 'rules-deploy' || inputs.command }}
      EMAIL: ${{ inputs.email }}
      FAMILY: ${{ inputs.family }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Exécuter
        run: |
          set -euo pipefail
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || { echo "Secret FIREBASE_SERVICE_ACCOUNT manquant"; exit 1; }
          FAM_ARGS=()
          if [ -n "$FAMILY" ]; then FAM_ARGS=(--family "$FAMILY"); fi
          case "$CMD" in
            rules-deploy) node scripts/games.mjs rules deploy ;;
            access-allow)
              [[ "$EMAIL" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]] || { echo "Email invalide"; exit 1; }
              node scripts/games.mjs access allow "$EMAIL" ;;
            access-show) node scripts/games.mjs access show ;;
            seed) node scripts/games.mjs add @scripts/seed.json "${FAM_ARGS[@]}" ;;
            families) node scripts/games.mjs families ;;
            *) echo "Commande inconnue: $CMD"; exit 1 ;;
          esac
