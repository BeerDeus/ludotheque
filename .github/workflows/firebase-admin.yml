name: Firebase admin

# Secrets : FIREBASE_SERVICE_ACCOUNT (JSON du compte de service), BGG_API_TOKEN (optionnel).
# Repo public => logs publics : ne jamais ajouter de commande qui affiche des emails.
on:
  push:
    paths: ['firestore.rules']
  workflow_dispatch:
    inputs:
      command:
        description: Action
        type: choice
        required: true
        default: export-pending
        options: [export-pending, export-all, sheets, squarify, covers, covers-all, autofill, autofill-all, rules-deploy, access-open, access-close, access-allow, access-show, seed]
      email:
        description: Email (pour access-allow)
        required: false
      family:
        description: familyId (pour seed, si plusieurs familles)
        required: false

permissions:
  contents: read

concurrency:
  group: firebase-admin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
      CMD: ${{ github.event_name == 'push' && 'rules-deploy' || inputs.command }}
      EMAIL: ${{ inputs.email }}
      FAMILY: ${{ inputs.family }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Exécuter
        run: |
          set -euo pipefail
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || { echo "Secret FIREBASE_SERVICE_ACCOUNT manquant"; exit 1; }
          FAM_ARGS=()
          if [ -n "$FAMILY" ]; then FAM_ARGS=(--family "$FAMILY"); fi
          case "$CMD" in
            rules-deploy) node scripts/games.mjs rules deploy ;;
            access-allow)
              [[ "$EMAIL" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]] || { echo "Email invalide"; exit 1; }
              node scripts/games.mjs access allow "$EMAIL" ;;
            access-open) node scripts/games.mjs access open true ;;
            access-close) node scripts/games.mjs access open false ;;
            access-show) node scripts/games.mjs access show ;;
            seed) node scripts/games.mjs add @scripts/seed.json "${FAM_ARGS[@]}" ;;
            export-pending) node scripts/games.mjs export --pending ;;
            export-all) node scripts/games.mjs export ;;
            squarify) node scripts/games.mjs squarify ;;
            sheets) node scripts/games.mjs sheets "$FAMILY" ;;
            covers) node scripts/games.mjs covers ;;
            covers-all) node scripts/games.mjs covers --all ;;
            autofill) node scripts/games.mjs autofill ;;
            autofill-all) node scripts/games.mjs autofill --all ;;
            *) echo "Commande inconnue: $CMD"; exit 1 ;;
          esac
