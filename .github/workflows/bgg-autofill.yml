name: BGG autofill

# Toutes les 5 min (+ délai GitHub), si BGG_API_TOKEN est défini : complétion BGG (image, âge, joueurs, durée,
# année, complexité, note, extensions) des jeux nouveaux/renommés. Rien de nouveau = aucune requête BGG.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Groupe à part : un run en attente du groupe firebase-admin (enrichissement, export) n'est jamais annulé par ce cron.
concurrency:
  group: bgg-autofill
  cancel-in-progress: false

jobs:
  autofill:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
    steps:
      - name: Vérifier les secrets
        id: check
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$BGG_API_TOKEN" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT ou BGG_API_TOKEN absent : rien à faire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v5
      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund
      - name: Autofill BGG
        if: steps.check.outputs.skip != 'true'
        run: node scripts/games.mjs autofill
