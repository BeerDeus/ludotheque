name: Images et autofill BGG

# Toutes les heures : images manquantes (Wikipédia) puis, si BGG_API_TOKEN est défini,
# complétion BGG (image, âge, joueurs, durée, année, complexité, note, extensions).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-admin
  cancel-in-progress: false

jobs:
  autofill:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
    steps:
      - name: Vérifier les secrets
        id: check
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT absent : rien à faire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v5
      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund
      - name: Autofill BGG
        if: steps.check.outputs.skip != 'true' && env.BGG_API_TOKEN != ''
        run: node scripts/games.mjs autofill
      - name: Images manquantes (Wikipédia)
        if: steps.check.outputs.skip != 'true'
        run: node scripts/games.mjs covers
