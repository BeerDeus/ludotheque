name: Appliquer les enrichissements

# Claude commite enrichments/<familyId>__<gameId>.json → ce workflow les écrit dans Firestore,
# supprime les fichiers appliqués puis lance l'autofill BGG.
on:
  push:
    paths: ['enrichments/*.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firebase-admin
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Appliquer
        id: apply
        run: |
          set +e
          node scripts/games.mjs apply enrichments --applied applied.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Retirer les fichiers appliqués
        run: |
          if [ -s applied.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            xargs git rm -q < applied.txt
            git commit -m "chore(enrichments): $(wc -l < applied.txt) fichier(s) appliqué(s) [skip ci]"
            git pull --rebase -q origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Autofill BGG
        if: env.BGG_API_TOKEN != ''
        run: node scripts/games.mjs autofill
      - name: Images manquantes (Wikipédia)
        run: node scripts/games.mjs covers
      - name: Échec d'application ?
        if: steps.apply.outputs.status != '0'
        run: exit 1
